<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tratamiento Cero</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container"></div>
    <div id="error-log" style="color: #ff6666; position: absolute; top: 10px; left: 10px; z-index: 9999; font-family: monospace; font-size: 13px; background: rgba(0,0,0,0.95); padding: 15px; max-width: 95%; border: 1px solid #ff6666; display: none; word-wrap: break-word;"></div>

    <script>
        window.onerror = function(msg, url, line) {
            const errorDiv = document.getElementById('error-log');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML += '⚠️ ' + msg + '<br>📁 ' + url + '<br>📍 Línea: ' + line + '<br><hr>';
            return false;
        };
    </script>

    <script src="lib/phaser.min.js"></script>
    <script src="js/locales.js"></script>
    <script src="js/scenes/boot.js"></script>
    <script src="js/scenes/CodigoFenix.js"></script>
    <script src="js/scenes/presentacion.js"></script>
    <script src="js/scenes/menu.js"></script>
    <script src="js/scenes/capitulos.js"></script>
    <script src="js/scenes/configuracion.js"></script>
    <script src="js/scenes/Capitulo1.js"></script>
    <script src="js/scenes/Interludio.js"></script>
    <script src="js/scenes/Capitulo2.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
