name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest for Landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="landscape"|g' $MANIFEST

      - name: Build Unsigned Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Decode and Verify Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          ls -l android/release.keystore
          echo "--- Verificando el keystore ---"
          keytool -list -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" || echo "⚠️ La contraseña del keystore podría ser incorrecta."

      - name: Sign APK with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android/app/build/outputs/apk/release/
          
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ../../../../release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --verbose \
            --out app-release-signed.apk \
            app-release-aligned.apk

      - name: Verify APK Signature
        run: |
          cd android/app/build/outputs/apk/release/
          echo "--- Verificando la firma del APK ---"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app-release-signed.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tratamiento-cero-release
          path: android/app/build/outputs/apk/release/app-release-signed.apk