name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ✅ PASO CLAVE: Instalar las Android Build-Tools y añadirlas al PATH
      - name: Install Android Build-Tools
        run: |
          yes | sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest for Landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="landscape"|g' $MANIFEST

      # 1. Compilamos el APK sin firmar
      - name: Build Unsigned Release APK
        run: cd android && ./gradlew assembleRelease

      # 2. Decodificamos tu llave
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      # 3. Firmamos el APK usando la ruta completa a las herramientas
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android/app/build/outputs/apk/release/
          
          # ✅ Usamos la ruta completa para evitar errores de PATH
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks ../../../../release.keystore \
          --ks-pass pass:$KEYSTORE_PASSWORD \
          --key-pass pass:$KEY_PASSWORD \
          --ks-key-alias $KEY_ALIAS \
          --out app-release-signed.apk app-release-aligned.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tratamiento-cero-release
          path: android/app/build/outputs/apk/release/app-release-signed.apk