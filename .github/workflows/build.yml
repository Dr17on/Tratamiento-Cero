name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest for Landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="landscape"|g' $MANIFEST

      # ==========================================
      # PASOS PARA FIRMAR EL APK (RELEASE)
      # ==========================================
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Inject Signing Config into build.gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<EOF
          
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "$KEYSTORE_PASSWORD"
                      keyAlias "$KEY_ALIAS"
                      keyPassword "$KEY_PASSWORD"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Compilamos el APK de Release (el oficial para Google Play)
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tratamiento-cero-release
          path: android/app/build/outputs/apk/release/app-release.apk